name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      # Skip doc/media-only noise; keep README.md (pyproject/Dockerfile packaging).
      - "LICENSE"
      - "docs/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "LICENSE"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Alembic reads DATABASE_URL; pytest uses PAYBACK_TEST_DATABASE_URL (same DB).
  DATABASE_URL: postgresql+asyncpg://payback:payback@127.0.0.1:5432/payback_test
  PAYBACK_TEST_DATABASE_URL: postgresql+asyncpg://payback:payback@127.0.0.1:5432/payback_test

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy payback tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payback
          POSTGRES_PASSWORD: payback
          POSTGRES_DB: payback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payback -d payback_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Alembic migration round-trip
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Pytest
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose
        run: |
          # env_file must exist for `compose config`; values are not used at runtime here.
          cp .env.example .env
          docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: payback:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
