# Mirrors `make check`: ruff + mypy + pytest on Postgres.
name: CI

on:
  push:
    branches: [work, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Mypy
        run: uv run mypy payback tests

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payback
          POSTGRES_PASSWORD: payback
          POSTGRES_DB: payback
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payback -d payback"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PAYBACK_TEST_DATABASE_URL: postgresql+asyncpg://payback:payback@127.0.0.1:5432/payback_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create payback_test database
        env:
          PGPASSWORD: payback
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h 127.0.0.1 -U payback -d payback -c "CREATE DATABASE payback_test;"
      - run: uv sync
      - name: Pytest
        run: uv run pytest
